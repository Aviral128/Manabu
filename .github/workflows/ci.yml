name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Build monorepo
        run: npm run build

      - name: Typecheck and lint monorepo
        run: npm run lint

      - name: Mobile doctor
        run: npm --prefix mobile_app run doctor
